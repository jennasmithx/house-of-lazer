<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | House of Lazer</title>
  <meta name="description" content="Shop professional aftercare and skincare products. Collect in store or get it delivered, with secure payment via PayFast.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try { var t = localStorage.getItem("hol-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Shop</span>
        <h1>Skincare &amp; aftercare</h1>
        <p class="lead">Professional products we use and trust. Pay securely online, then collect from the studio or choose delivery.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters" id="filters" role="toolbar" aria-label="Filter by category"></div>
        <div class="grid grid-4" id="product-grid"><p class="muted">Loading products…</p></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
