<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | House of Lazer</title>
  <meta name="description" content="Reset your House of Lazer account password.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="section">
      <div class="container">
        <form class="card form auth-card" id="forgot-form" novalidate>
          <h2>Forgot your password?</h2>
          <p class="muted">Enter your email and we'll send you a link to choose a new one.</p>
          <div><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
          <div class="alert" id="forgot-alert" hidden></div>
          <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
          <div class="form-links"><a href="/account">&larr; Back to sign in</a></div>
        </form>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/password.js"></script>
</body>
</html>
