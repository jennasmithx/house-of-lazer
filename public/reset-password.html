<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a New Password | House of Lazer</title>
  <meta name="description" content="Choose a new password for your House of Lazer account.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try { var t = localStorage.getItem("hol-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="section">
      <div class="container">
        <form class="card form auth-card" id="reset-form" novalidate>
          <h2>Choose a new password</h2>
          <div><label for="r-password">New password</label><input id="r-password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
          <div><label for="r-confirm">Confirm new password</label><input id="r-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required></div>
          <div class="alert" id="reset-alert" hidden></div>
          <button class="btn btn--primary btn--block" type="submit">Update password</button>
        </form>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/password.js"></script>
</body>
</html>
