<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact & Bookings | House of Lazer</title>
  <meta name="description" content="Book a consultation or get in touch with House of Lazer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try { var t = localStorage.getItem("hol-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Contact</span>
        <h1>Get in touch</h1>
        <p class="lead">Questions about a treatment or an order? Send us a message and we'll reply within one working day. Ready to book? <a href="/book">Request a booking here</a>.</p>
      </div>
    </section>

    <section class="section">
      <div class="container split" style="align-items:start">
        <div>
          <ul class="contact-list" id="contact-details"></ul>
          <h3>Opening hours</h3>
          <table class="hours">
            <tr><td>Monday – Friday</td><td>09:00 – 17:00</td></tr>
            <tr><td>Saturday</td><td>09:00 – 13:00</td></tr>
            <tr><td>Sunday &amp; public holidays</td><td>Closed</td></tr>
          </table>
        </div>
        <form class="card form" id="contact-form" novalidate>
          <h3>Send a message</h3>
          <div class="form-row">
            <div><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name" required></div>
            <div><label for="c-phone">Phone</label><input id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
          </div>
          <div><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
          <div>
            <label for="c-service">Treatment of interest</label>
            <select id="c-service" name="service"><option value="">General enquiry</option></select>
          </div>
          <div><label for="c-message">Message</label><textarea id="c-message" name="message" required placeholder="Tell us what you'd like to book or ask about. Include preferred days and times."></textarea></div>
          <div class="alert" id="contact-alert" hidden></div>
          <button class="btn btn--primary" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/js/contact.js"></script>
</body>
</html>
