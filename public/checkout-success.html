<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | House of Lazer</title>
  <meta name="description" content="Your order has been received.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try { var t = localStorage.getItem("hol-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="section">
      <div class="container center" style="max-width:640px">
        <div class="status-icon" id="status-icon"></div>
        <h1 style="font-size:2.8rem">Thank you!</h1>
        <p class="lead" style="margin:0 auto 12px" id="status-text">We've received your order and are confirming your payment.</p>
        <p class="muted" id="status-detail"></p>
        <div class="hero-actions" style="justify-content:center">
          <a class="btn btn--primary" href="/shop">Continue shopping</a>
          <a class="btn btn--outline" href="/">Back to home</a>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/js/success.js"></script>
</body>
</html>
